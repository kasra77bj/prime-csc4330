[project]
name = "prime-backend"
version = "0.1.0"
description = "PRIME: real-time monitoring and AI process control for concrete 3D printing (CSC 4330)"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.115.*",
  "uvicorn[standard]==0.32.*",
  "sqlalchemy[asyncio]==2.0.*",
  "asyncpg==0.30.*",
  "psycopg[binary]==3.2.*",
  "alembic==1.14.*",
  "pydantic==2.*",
  "pydantic-settings==2.*",
  "email-validator==2.*",
  "argon2-cffi==23.*",
  "pyjwt==2.*",
  "pyotp==2.*",
  "qrcode==8.*",
  "cryptography>=43",
  "pyyaml==6.*",
  "pandas>=2.2",
  "pyarrow>=17",
  "openpyxl==3.*",
  "tabulate>=0.9",
  # ML: pinned to what the team's pickles need (see ml/MODEL_REPORT.md)
  "numpy>=2.0",
  "scikit-learn==1.8.0",
  "xgboost==3.4.1",
  "joblib>=1.4",
  "shap>=0.46",
]

[project.optional-dependencies]
dev = ["pytest==8.*", "pytest-asyncio==0.24.*", "httpx==0.27.*", "ruff>=0.7"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
