<!doctype html>
<!-- S02 · MFA code · /login/verify · US-01 -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>PRIME · Verify</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles/app.css">
<style>
  .code { width: 56px; height: 64px; border-radius: var(--radius-ctl); border: 1px solid var(--border); background: var(--surface);
    display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .code-filled { border-color: var(--text-muted); }
  .caret { width: 2px; height: 30px; background: var(--brand-600); }
</style>
</head>
<body data-frame="desktop" class="bg-canvas relative">

<main class="relative flex flex-col items-center pt-[88px]">
  <img src="../../assets/logo/prime-logo-horizontal.svg" alt="PRIME" class="h-[48px]">
  <div class="caption mt-3 tracking-[.08em] uppercase font-semibold">AI-powered concrete 3D printing platform</div>

  <section class="card w-[440px] mt-10 px-10 py-9">
    <a class="link text-[13px] flex items-center gap-1"><svg data-lucide="chevron-left" class="ic-sm" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>dev.patel@prime.example</a>
    <h1 class="h2 text-[24px] leading-[32px] mt-4">Check your authenticator app</h1>
    <p class="text-text-muted mt-1">Enter the 6-digit code from your authenticator app.</p>

    <div class="flex justify-between mt-7">
      <div class="code code-filled">4</div>
      <div class="code code-filled">8</div>
      <div class="code code-filled">2</div>
      <div class="code input-focus"><span class="caret"></span></div>
      <div class="code"></div>
      <div class="code"></div>
    </div>
    <div class="flex items-center gap-2 caption text-[13px] mt-4"><svg data-lucide="timer" class="ic-sm" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="10" x2="14" y1="2" y2="2"/><line x1="12" x2="15" y1="14" y2="11"/><circle cx="12" cy="14" r="8"/></svg>Code expires in <span class="num font-semibold text-text" data-bind="mfa.expiresIn">0:24</span></div>

    <button class="btn btn-primary h-[48px] text-[15px] w-full mt-6">Verify</button>
    <div class="flex justify-center mt-4"><a class="link text-[13px]">Use a backup code</a></div>
  </section>

  <div class="flex items-center gap-2 mt-6 caption text-[13px]">
    <svg data-lucide="lock" class="ic-sm" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>Secured with 2-factor authentication · Encrypted in transit and at rest
  </div>
</main>

<script type="module">
  import { mount } from '../lib/mount.js';
  mount();
</script>
</body>
</html>
