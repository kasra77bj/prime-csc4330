<!doctype html>
<!-- S01 · Login · /login · US-01 -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>PRIME · Sign in</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles/app.css">
</head>
<body data-frame="desktop" class="bg-canvas relative">

<main class="relative flex flex-col items-center pt-[88px]">
  <img src="../../assets/logo/prime-logo-horizontal.svg" alt="PRIME" class="h-[48px]">
  <div class="caption mt-3 tracking-[.08em] uppercase font-semibold">AI-powered concrete 3D printing platform</div>

  <section class="card w-[440px] mt-10 px-10 py-9">
    <h1 class="h2 text-[24px] leading-[32px]">Sign in to PRIME</h1>
    <p class="text-text-muted mt-1">Use your work email. You'll confirm it's you with your authenticator app next.</p>

    <div class="mt-7 flex flex-col gap-5">
      <div>
        <label class="field-label">Email</label>
        <div class="input"><svg data-lucide="mail" class="ic-sm text-text-muted" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7"/><rect x="2" y="4" width="20" height="16" rx="2"/></svg>dev.patel@prime.example</div>
      </div>
      <div>
        <div class="flex items-baseline justify-between"><label class="field-label">Password</label><a class="link text-[13px]">Forgot password?</a></div>
        <div class="input input-focus"><svg data-lucide="key-round" class="ic-sm text-text-muted" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"/><circle cx="16.5" cy="7.5" r=".5" fill="currentColor"/></svg><span class="flex-1 tracking-[.22em]">••••••••••••</span><span class="flex items-center gap-1 text-[13px] font-medium text-brand-600"><svg data-lucide="eye" class="ic-sm" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>Show</span></div>
      </div>
      <label class="flex items-center gap-3 text-[14px]"><span class="checkbox checkbox-on"><svg data-lucide="check" class="ic-xs" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span>Remember this device for 30 days</label>
      <button class="btn btn-primary h-[48px] text-[15px] w-full mt-1">Sign in</button>
    </div>
  </section>

  <div class="flex items-center gap-2 mt-6 caption text-[13px]">
    <svg data-lucide="lock" class="ic-sm" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>Secured with 2-factor authentication · Encrypted in transit and at rest
  </div>
</main>
</body>
</html>
