# PRIME local stack: Postgres + FastAPI backend + Vite frontend.
# Build once while online (`docker compose build`); the demo itself runs offline.
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: prime, POSTGRES_PASSWORD: prime, POSTGRES_DB: prime }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U prime"], interval: 3s, retries: 30 }

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://prime:prime@db:5432/prime
      MODEL_DIR: /app/ml_models
      MODEL_CONFIG_PATH: /app/ml/model_config.yaml
      DATA_DIR: /app/data
    depends_on: { db: { condition: service_healthy } }
    volumes:
      - ./data:/app/data
      - ./raw_data:/app/raw_data:ro
      - ./ml:/app/ml:ro
      - ./ml_models:/app/ml_models:ro
    ports: ["8000:8000"]
    command: sh -c "alembic upgrade head && python -m app.seed.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build: ./frontend
    environment: { VITE_PROXY_TARGET: "http://backend:8000" }
    ports: ["5173:5173"]
    depends_on: [backend]

volumes:
  pgdata: {}
